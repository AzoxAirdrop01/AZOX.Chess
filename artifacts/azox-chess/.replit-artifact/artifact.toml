kind = "web"
previewPath = "/"
title = "AZOX Chess"
version = "1.0.0"
id = "artifacts/azox-chess"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18703

[services.development]
run = "pnpm --filter @workspace/azox-chess run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/azox-chess", "run", "build" ]
publicDir = "artifacts/azox-chess/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18703"
BASE_PATH = "/"
